# FrigateProtect fork: build the amd64 image and push it to ghcr.io/lman80/frigate.
# Branch strategy and usage: FrigateProtect repo, docs/FRIGATE-FORK.md.
#   - push a tag  v<upstream-version>-fp<N>   (e.g. v0.18.0-fp1)  -> image :0.18.0-fp1
#   - or run it by hand (Actions > "FrigateProtect fork build") with a tag input
# Only amd64 (the Frigate box is an Intel N95). Upstream's own workflows are
# disabled in this fork so syncing master/dev never starts their big matrix.
name: FrigateProtect fork build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 0.18.0-fp1"
        required: true
  push:
    tags:
      - "v*-fp*"

permissions:
  contents: read
  packages: write

concurrency:
  group: fp-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then T="${GITHUB_REF_NAME#v}"; else T="${INPUT_TAG}"; fi
          echo "$T" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-fp[0-9]+$' || { echo "bad tag: $T"; exit 1; }
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          echo "base=ghcr.io/blakeblackshear/frigate:${T%-fp*}" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      # The official release image + our patched files (docker/fp/Dockerfile). A full
      # source build stopped working when a build dependency left GitHub (Nov 2026).
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/fp/Dockerfile
          build-args: BASE=${{ steps.tag.outputs.base }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Frigate with FrigateProtect patches
